crypto:
  secret-key: ${CRYPTO_SECRET_KEY}
spring:
  config:
    # 로컬 공통 설정(DB 스키마·계정·비밀번호 등) — 키 목록은 메타 레포 .claude/skills/db-setup/env.example 참고
    import: optional:file:${user.home}/.config/atlas-flight/.env[.properties]
  application:
    name: customer
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${CUSTOMER_DB_SCHEMA}?allowMultiQueries=true
    username: ${CUSTOMER_DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)으로만 관리한다.
      # validate: 엔티티와 실제 스키마가 어긋나면 기동 시점에 바로 실패시켜 드리프트를 조기에 잡는다.
      # (과거 update 가 REL_CD 유령 컬럼을 만들어 버그를 숨겼던 재발 방지)
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server:
  port: 8086
  servlet:
    context-path: /customer/api

logging:
  level:
    jdbc: 'OFF'              # log4jdbc audit/connection/resultset 차단 (HikariCP housekeeper의 Connection.isValid 노이즈 포함)
    jdbc.sqltiming: 'INFO'   # 실행 SQL + 수행시간은 유지